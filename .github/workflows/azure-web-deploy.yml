name: Deploy Blazor Web to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish
        run: dotnet publish src/frontend/FinanceManagement.Web/FinanceManagement.Web.csproj -c Release -o publish

      - name: List publish output
        run: ls -la publish/ && echo "---" && ls -la publish/wwwroot/ 2>/dev/null || echo "wwwroot not found"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: financemanagement-web
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_WEB }}
          package: publish/wwwroot
